{% extends 'base.html' %}

{% block title %}Login - DEARS{% endblock %}

{% block content %}
<section style="padding: 3rem 0;">
    <div class="container-sm">
        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <div class="text-center mb-4">
                <div class="logo-icon" style="width: 60px; height: 60px; font-size: 2rem; margin: 0 auto 1rem;">⚠</div>
                <h2>Admin Login</h2>
                <p class="text-muted">Access the DEARS administration dashboard</p>
            </div>

            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                <div class="alert alert-error mb-3">
                    Invalid username or password. Please try again.
                </div>
                {% endif %}

                <div class="form-group">
                    <label class="form-label" for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" class="form-input" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" class="form-input" required>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-large btn-block">Login</button>
                </div>

                <input type="hidden" name="next" value="{{ next }}">
            </form>

            <div class="text-center mt-3">
                <p class="text-muted">
                    <a href="{% url 'home' %}">← Back to Home</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
